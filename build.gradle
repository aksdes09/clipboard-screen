plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

// ---------------------------------------------------------------- supported versions
// `./gradlew build` makes TWO jars in build/libs: one for Fabric, one for NeoForge.
// Each of them runs on every Minecraft version below: 26.x is not obfuscated, so the
// compiled mod refers to the game by real names, and those are the same in all of them.
// -Pminecraft_version only picks which version to COMPILE against; CI compiles against
// each one and checks that the bytecode is identical (see .github/workflows/build.yml).
ext.targets = [
	'26.1.2': [modmenu: '18.0.2',        neoforge: '26.1.2.126'],
	'26.2'  : [modmenu: '20.0.3',        neoforge: '26.2.0.93'],
	'26.3'  : [modmenu: '21.0.0-beta.1', neoforge: '26.3.0.101'],
]

ext.mcVersion = providers.gradleProperty('minecraft_version').get()
ext.target = targets[mcVersion]
if (target == null) {
	throw new GradleException("Minecraft ${mcVersion} is not supported. Supported: ${targets.keySet().join(', ')}")
}

def oldest = targets.keySet().first()
def newest = targets.keySet().last()
def newestParts = newest.tokenize('.')
def nextMinor = "${newestParts[0]}.${(newestParts[1] as int) + 1}"                // 26.4

ext.versionLabel   = "${oldest}-${newest}"                                          // 26.1.2-26.3
ext.fabricRanges   = groovy.json.JsonOutput.toJson(targets.keySet().collect { "~${it}" }) // ["~26.1.2","~26.2","~26.3"]
ext.minecraftRange = "[${oldest},${nextMinor})"                                     // [26.1.2,26.4)
ext.neoforgeRange  = "[${oldest},${nextMinor})"                                     // NeoForge 26.1.2.x ... 26.3.x
