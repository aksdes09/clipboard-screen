pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'clipshot'

// common/ is not a project: its sources are compiled into both loader jars (see gradle/loader-common.gradle).
include 'fabric'
include 'neoforge'
