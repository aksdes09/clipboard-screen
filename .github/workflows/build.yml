name: build
on: [push, workflow_dispatch]

# Two jars (Fabric + NeoForge), each for Minecraft 26.1.2, 26.2 and 26.3.
# 1. Compile both loaders against each Minecraft version (+ check the Screenshot.grab hook there).
# 2. Per loader, compare the compiled classes: identical bytecode = the jar built against 26.3
#    calls exactly the same game methods on 26.1.2 and 26.2 too.
# 3. Publish both jars (artifact "clipshot").

jobs:
  build:
    name: Compile against ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build Fabric + NeoForge
        run: chmod +x gradlew && ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - name: Mixin target report
        if: always()
        run: |
          cat fabric/build/reports/screenshot-hook.txt || true
          echo
          cat neoforge/build/reports/screenshot-hook.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: classes-${{ matrix.minecraft }}
          path: |
            fabric/build/classes/java/main
            neoforge/build/classes/java/main
      - uses: actions/upload-artifact@v4
        if: matrix.minecraft == '26.3'
        with:
          name: jars-26.3
          path: build/libs/*.jar

  publish:
    name: Fabric + NeoForge jars for all versions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          pattern: classes-*
          path: classes
      - name: Compare bytecode
        working-directory: classes
        run: |
          fail=0
          for loader in fabric neoforge; do
            base="classes-26.3/$loader/build/classes/java/main"
            for version_dir in classes-*; do
              [ "$version_dir" = "classes-26.3" ] && continue
              version="${version_dir#classes-}"
              other="$version_dir/$loader/build/classes/java/main"
              if diff -r -q "$base" "$other" > /dev/null; then
                echo "OK: $loader bytecode compiled against $version is identical to 26.3"
              else
                fail=1
                echo "::error::$loader bytecode compiled against $version differs from 26.3 - one jar is not safe for that version"
                diff -r -q "$base" "$other" || true
                (cd "$base" && find . -name '*.class') | while read -r f; do
                  if ! cmp -s "$base/$f" "$other/$f"; then
                    echo "----- $loader: $f"
                    diff <(javap -c -p "$base/$f" 2>&1 | sed -E 's/#[0-9]+//g') <(javap -c -p "$other/$f" 2>&1 | sed -E 's/#[0-9]+//g') | head -40 || true
                  fi
                done
              fi
            done
          done
          exit $fail
      - uses: actions/download-artifact@v4
        with:
          name: jars-26.3
          path: jars
      - uses: actions/upload-artifact@v4
        with:
          name: clipshot
          path: jars/*.jar
