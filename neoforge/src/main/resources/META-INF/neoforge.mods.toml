modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0"

[[mods]]
modId = "clipshot"
version = "${version}"
displayName = "ClipShot"
authors = "aksdes"
logoFile = "assets/clipshot/icon.png"
description = '''
A lightweight mod that copies F2 screenshots to the clipboard and notifies you of this in chat.
'''

[[mixins]]
config = "clipshot.mixins.json"

[[dependencies.clipshot]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.clipshot]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
